    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(99, 102, 241, 0.4)',
              'glow-accent': '0 0 20px -5px rgba(16, 185, 129, 0.4)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09090b; /* zinc-950 */

        width: 6px;

      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }
